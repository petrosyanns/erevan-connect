<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Erevan Connect</title>
  
  <!-- Telegram Web App SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  
  <!-- Tailwind CSS & FontAwesome -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'] }
        }
      }
    }
  </script>

  <style>
    /* Glassmorphism */
    .glass-card {
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .pulse-glow {
      box-shadow: 0 0 15px rgba(99, 102, 241, 0.35);
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased min-h-screen pb-24 select-none">

  <div class="max-w-md mx-auto px-4 py-4 space-y-4">

    <!-- 1. Header -->
    <header class="flex justify-between items-center glass-card p-3.5 px-4 rounded-2xl shadow-xl">
      <div class="flex items-center space-x-3">
        <div class="relative">
          <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-rose-500 to-indigo-600 p-[1px]">
            <div class="w-full h-full bg-slate-900 rounded-[11px] flex items-center justify-center text-lg">
              🇦🇲
            </div>
          </div>
          <!-- Живая точка онлайна -->
          <span class="absolute -top-0.5 -right-0.5 flex h-3 w-3">
            <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
            <span class="relative inline-flex rounded-full h-3 w-3 bg-emerald-500 border-2 border-slate-950"></span>
          </span>
        </div>
        <div>
          <div class="flex items-center space-x-1">
            <!-- Исправленный градиентный текст через чистый Tailwind -->
            <h1 class="text-base font-extrabold tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-indigo-400 via-rose-400 to-amber-400">
              Erevan Connect
            </h1>
            <i class="fa-solid fa-circle-check text-indigo-400 text-xs"></i>
          </div>
          <p class="text-[10px] text-slate-400 font-medium">Комьюнити & Встречи</p>
        </div>
      </div>

      <!-- Кнопка перехода в Канал -->
      <a href="https://t.me/erevan_connect" target="_blank" class="flex items-center space-x-1.5 bg-indigo-500/10 border border-indigo-500/20 px-3 py-1.5 rounded-xl text-xs font-semibold text-indigo-400 hover:bg-indigo-500/20 transition-all active:scale-95">
        <i class="fa-brands fa-telegram text-sm"></i>
        <span>Канал</span>
      </a>
    </header>

    <!-- 2. Табы переключения (Лента / Создать) -->
    <div class="flex glass-card p-1 rounded-xl text-xs font-semibold">
      <button id="tab-feed" onclick="switchTab('feed')" class="flex-1 py-2.5 rounded-lg bg-indigo-600 text-white text-center transition-all shadow-md shadow-indigo-600/30">
        🔥 Лента
      </button>
      <button id="tab-create" onclick="switchTab('create')" class="flex-1 py-2.5 rounded-lg text-slate-400 hover:text-white text-center transition-all">
        ➕ Создать
      </button>
    </div>

    <!-- 3. Секция 1: ЛЕНТА СОБЫТИЙ -->
    <div id="section-feed" class="space-y-3">
      
      <!-- Фильтры категорий -->
      <div class="flex space-x-2 overflow-x-auto pb-1 scrollbar-none text-xs font-medium">
        <button class="px-3.5 py-1.5 rounded-xl bg-slate-800 text-indigo-400 font-semibold border border-indigo-500/30 whitespace-nowrap">Все</button>
        <button class="px-3.5 py-1.5 rounded-xl glass-card text-slate-400 hover:text-white whitespace-nowrap">⚽️ Спорт</button>
        <button class="px-3.5 py-1.5 rounded-xl glass-card text-slate-400 hover:text-white whitespace-nowrap">☕️ Кофе</button>
        <button class="px-3.5 py-1.5 rounded-xl glass-card text-slate-400 hover:text-white whitespace-nowrap">🎲 Настолки</button>
      </div>

      <!-- Контейнер для загрузки объявлений из app.js -->
      <div id="events-list" class="space-y-3">
        <!-- Дефолтная карточка-заглушка до загрузки из Supabase -->
        <div class="glass-card rounded-2xl p-4 space-y-3">
          <div class="flex justify-between items-start">
            <div class="flex items-center space-x-2.5">
              <div class="w-8 h-8 rounded-full bg-indigo-500/20 text-indigo-400 flex items-center justify-center font-bold text-xs border border-indigo-500/30">
                EC
              </div>
              <div>
                <div class="flex items-center space-x-1">
                  <span class="text-xs font-bold text-slate-200">Erevan Connect Team</span>
                  <i class="fa-solid fa-circle-check text-[10px] text-indigo-400"></i>
                </div>
                <span class="text-[10px] text-slate-400">@erevan_connect</span>
              </div>
            </div>
            
            <button title="Пожаловаться" class="text-slate-500 hover:text-rose-400 text-xs p-1 transition-colors">
              <i class="fa-regular fa-flag"></i>
            </button>
          </div>

          <div>
            <h3 class="text-sm font-bold text-white">Добро пожаловать в комьюнити!</h3>
            <p class="text-xs text-slate-300 mt-1">Создавай свои объявления или откликайся на встречи других участников.</p>
          </div>

          <div class="flex items-center justify-between pt-2 border-t border-white/5 text-[11px] text-slate-400">
            <div class="flex items-center space-x-3">
              <span><i class="fa-solid fa-location-dot text-rose-400 mr-1"></i> Ереван</span>
              <span><i class="fa-solid fa-users text-indigo-400 mr-1"></i> ∞</span>
            </div>
          </div>
        </div>
      </div>

    </div>

    <!-- 4. Секция 2: ФОРМА СОЗДАНИЯ -->
    <div id="section-create" class="hidden glass-card rounded-2xl p-4 space-y-3 border border-indigo-500/20">
      <h3 class="text-sm font-bold text-white mb-1">Создать новое объявление</h3>
      
      <div>
        <label class="text-[10px] font-semibold text-slate-400 uppercase tracking-wider block mb-1">Заголовок</label>
        <input type="text" id="event-title" placeholder="Напр. Кофе в Кентроне" class="w-full bg-slate-900/90 border border-slate-800 rounded-xl p-3 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 transition-colors">
      </div>

      <div>
        <label class="text-[10px] font-semibold text-slate-400 uppercase tracking-wider block mb-1">Описание</label>
        <textarea id="event-desc" rows="3" placeholder="Расскажите подробности встречи..." class="w-full bg-slate-900/90 border border-slate-800 rounded-xl p-3 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 transition-colors"></textarea>
      </div>

      <div>
        <label class="text-[10px] font-semibold text-slate-400 uppercase tracking-wider block mb-1">Локация</label>
        <input type="text" id="event-location" placeholder="Напр. Каскад или Вернисаж" class="w-full bg-slate-900/90 border border-slate-800 rounded-xl p-3 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 transition-colors">
      </div>

      <button onclick="submitEvent()" class="w-full bg-gradient-to-r from-rose-500 to-indigo-600 hover:from-rose-600 hover:to-indigo-700 text-white font-bold py-3.5 rounded-xl text-xs transition-all shadow-lg shadow-indigo-600/20 active:scale-98">
        Опубликовать событие
      </button>
    </div>

  </div>

  <!-- Подключение app.js и инициализация Telegram WebApp -->
  <script src="app.js"></script>
  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    function switchTab(tab) {
      const feedBtn = document.getElementById('tab-feed');
      const createBtn = document.getElementById('tab-create');
      const feedSec = document.getElementById('section-feed');
      const createSec = document.getElementById('section-create');

      if (tab === 'feed') {
        feedBtn.className = "flex-1 py-2.5 rounded-lg bg-indigo-600 text-white text-center transition-all shadow-md shadow-indigo-600/30";
        createBtn.className = "flex-1 py-2.5 rounded-lg text-slate-400 hover:text-white text-center transition-all";
        feedSec.classList.remove('hidden');
        createSec.classList.add('hidden');
      } else {
        createBtn.className = "flex-1 py-2.5 rounded-lg bg-indigo-600 text-white text-center transition-all shadow-md shadow-indigo-600/30";
        feedBtn.className = "flex-1 py-2.5 rounded-lg text-slate-400 hover:text-white text-center transition-all";
        createSec.classList.remove('hidden');
        feedSec.classList.add('hidden');
      }
    }
  </script>
</body>
</html>
