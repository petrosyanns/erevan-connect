<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Erevan Connect</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800 p-4">

  <div id="app" class="max-w-md mx-auto space-y-4">
    <!-- Шапка -->
    <div class="flex justify-between items-center bg-white p-4 rounded-xl shadow-sm">
      <h1 class="text-xl font-bold text-indigo-600">Erevan Connect 🇦🇲</h1>
      <span id="user-name" class="text-sm font-medium text-gray-500"></span>
    </div>

    <!-- Переключатель вкладок -->
    <div class="flex border-b border-gray-200 bg-white rounded-lg p-1 shadow-sm">
      <button id="tab-feed" onclick="switchTab('feed')" class="flex-1 py-2 text-center font-medium text-indigo-600 border-b-2 border-indigo-600">Лента</button>
      <button id="tab-create" onclick="switchTab('create')" class="flex-1 py-2 text-center font-medium text-gray-500">Создать</button>
    </div>

    <!-- Вкладка 1: Лента объявлений -->
    <div id="section-feed" class="space-y-3">
      <div id="events-list" class="space-y-3">
        <p class="text-center text-gray-400 py-6">Загрузка объявлений...</p>
      </div>
    </div>

    <!-- Вкладка 2: Форма создания -->
    <div id="section-create" class="hidden bg-white p-4 rounded-xl shadow-sm space-y-3">
      <h2 class="text-lg font-bold">Новая заявка</h2>
      
      <div>
        <label class="text-xs font-semibold text-gray-500">Категория</label>
        <select id="field-category" class="w-full border rounded-lg p-2 mt-1 text-sm bg-gray-50"></select>
      </div>

      <div>
        <label class="text-xs font-semibold text-gray-500">Заголовок</label>
        <input type="text" id="field-title" placeholder="например: Ищу +2 на футбол" class="w-full border rounded-lg p-2 mt-1 text-sm">
      </div>

      <div>
        <label class="text-xs font-semibold text-gray-500">Локация</label>
        <input type="text" id="field-location" placeholder="например: Аван, поле Hatis" class="w-full border rounded-lg p-2 mt-1 text-sm">
      </div>

      <div>
        <label class="text-xs font-semibold text-gray-500">Описание</label>
        <textarea id="field-description" placeholder="Детали, уровень игры или планов" class="w-full border rounded-lg p-2 mt-1 text-sm h-20"></textarea>
      </div>

      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="text-xs font-semibold text-gray-500">Дата и время</label>
          <input type="datetime-local" id="field-date" class="w-full border rounded-lg p-2 mt-1 text-sm">
        </div>
        <div>
          <label class="text-xs font-semibold text-gray-500">Человек нужно</label>
          <input type="number" id="field-people" value="2" min="1" max="20" class="w-full border rounded-lg p-2 mt-1 text-sm">
        </div>
      </div>

      <button onclick="submitEvent()" class="w-full bg-indigo-600 text-white font-semibold py-2.5 rounded-lg text-sm shadow hover:bg-indigo-700 active:scale-95 transition">Опубликовать</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
