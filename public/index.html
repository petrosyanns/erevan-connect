<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Совместный Досуг</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      background: #0f172a;
      color: #f8fafc;
      font-family: system-ui, -apple-system, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    .glass {
      background: rgba(30, 41, 59, 0.75);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .fade-in { animation: fadeIn 0.25s ease-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body class="pb-24">

  <!-- Шапка -->
  <header class="sticky top-0 z-40 glass px-4 py-3 flex items-center justify-between">
    <div>
      <div id="hello" class="text-sm font-bold text-white">Загрузка...</div>
    </div>
    <div class="flex items-center gap-2">
      <button onclick="switchLanguage()" class="glass text-[11px] font-bold px-2.5 py-1.5 rounded-xl text-indigo-300 hover:bg-indigo-500/20 active:scale-95 transition">
        🌐 <span id="lang-btn">EN</span>
      </button>
      <button onclick="openModal()" class="bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-xs px-3.5 py-1.5 rounded-xl shadow-lg shadow-indigo-600/30 flex items-center gap-1.5 active:scale-95 transition">
        <i class="fa-solid fa-plus text-[10px]"></i>
        <span id="txt-create-btn">Создать</span>
      </button>
    </div>
  </header>

  <main class="p-4 space-y-4 max-w-md mx-auto">
    <!-- Поиск -->
    <div class="relative">
      <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-3 text-zinc-500 text-xs"></i>
      <input type="text" id="search" oninput="renderEvents()" placeholder="Поиск встреч..." 
             class="w-full bg-slate-800/90 border border-slate-700/60 rounded-xl pl-9 pr-4 py-2.5 text-xs text-white placeholder-zinc-500 focus:outline-none focus:border-indigo-500">
    </div>

    <!-- Фильтры -->
    <div class="space-y-2">
      <!-- Категории без повторов -->
      <div id="category-chips" class="flex gap-2 overflow-x-auto pb-1 scrollbar-none text-xs"></div>

      <!-- Формат и Города (Армения) -->
      <div class="grid grid-cols-2 gap-2">
        <select id="filter-format" onchange="renderEvents()" class="bg-slate-800 border border-slate-700/60 rounded-xl px-3 py-2 text-xs text-zinc-300 focus:outline-none focus:border-indigo-500">
          <option value="all" id="opt-all-formats">Все форматы</option>
          <option value="offline" id="opt-offline">📍 Офлайн</option>
          <option value="online" id="opt-online">💻 Онлайн</option>
        </select>

        <select id="filter-location" onchange="renderEvents()" class="bg-slate-800 border border-slate-700/60 rounded-xl px-3 py-2 text-xs text-zinc-300 focus:outline-none focus:border-indigo-500">
          <option value="all" id="opt-all-cities">Все города</option>
          <option value="Ереван">Ереван / Yerevan</option>
          <option value="Гюмри">Гюмри / Gyumri</option>
          <option value="Ванадзор">Ванадзор / Vanadzor</option>
          <option value="Дилижан">Дилижан / Dilijan</option>
          <option value="Севан">Севан / Sevan</option>
          <option value="Цахкадзор">Цахкадзор / Tsaghkadzor</option>
        </select>
      </div>
    </div>

    <!-- Лента встреч -->
    <div id="events-list" class="space-y-3">
      <div class="text-center text-xs text-zinc-500 py-8">Загрузка объявлений...</div>
    </div>
  </main>

  <!-- Модальное окно создания -->
  <div id="modal" class="fixed inset-0 bg-black/75 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden fade-in">
    <div class="glass w-full max-w-md rounded-2xl p-5 space-y-4 max-h-[90vh] overflow-y-auto">
      <div class="flex items-center justify-between border-b border-slate-700/50 pb-3">
        <h2 id="txt-modal-title" class="text-sm font-bold text-white">Новая встреча</h2>
        <button onclick="closeModal()" class="text-zinc-400 hover:text-white p-1"><i class="fa-solid fa-xmark text-lg"></i></button>
      </div>

      <div class="space-y-3">
        <div>
          <label id="lbl-category" class="block text-[11px] text-zinc-400 mb-1">Категория</label>
          <select id="event-category" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2.5 text-xs text-white focus:outline-none focus:border-indigo-500"></select>
        </div>

        <div>
          <label id="lbl-title" class="block text-[11px] text-zinc-400 mb-1">Заголовок *</label>
          <input type="text" id="event-title" placeholder="" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2.5 text-xs text-white placeholder-zinc-500 focus:outline-none focus:border-indigo-500">
        </div>

        <div>
          <label id="lbl-desc" class="block text-[11px] text-zinc-400 mb-1">Описание</label>
          <textarea id="event-desc" rows="2" placeholder="" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2.5 text-xs text-white placeholder-zinc-500 focus:outline-none focus:border-indigo-500"></textarea>
        </div>

        <!-- Раздельный блок: Локация и Формат -->
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label id="lbl-location" class="block text-[11px] text-zinc-400 mb-1">Локация / Город *</label>
            <input type="text" id="event-location" placeholder="" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2.5 text-xs text-white placeholder-zinc-500 focus:outline-none focus:border-indigo-500">
          </div>
          <div>
            <label id="lbl-format" class="block text-[11px] text-zinc-400 mb-1">Формат</label>
            <select id="event-format" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2.5 text-xs text-white focus:outline-none focus:border-indigo-500">
              <option value="offline">📍 Офлайн</option>
              <option value="online">💻 Онлайн</option>
            </select>
          </div>
        </div>

        <!-- Раздельные блоки: Дата и Места -->
        <div class="space-y-3 pt-1">
          <div>
            <label id="lbl-date" class="block text-[11px] font-medium text-indigo-300 mb-1">Дата и время *</label>
            <input type="datetime-local" id="event-date" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2.5 text-xs text-white focus:outline-none focus:border-indigo-500">
          </div>
          <div>
            <label id="lbl-max" class="block text-[11px] font-medium text-emerald-400 mb-1">Количество человек (мест)</label>
            <input type="number" id="event-max" value="2" min="1" max="50" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2.5 text-xs text-white focus:outline-none focus:border-indigo-500">
          </div>
        </div>
      </div>

      <button id="btn-submit-event" type="button" onclick="submitEvent()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-xs py-3 rounded-xl shadow-lg shadow-indigo-600/30 active:scale-98 transition">
        Опубликовать
      </button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
